# geminus 公共 location 片段（被 80/443 两个 server include）
# 静态资源 + /api 反代 + SSE + 上传 + 安全头

    root /opt/geminus/current/web;
    index index.html;

    # 隐藏版本号 + 基础安全响应头
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩（SSE 除外：text/event-stream 禁 gzip）
    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态 hash 资产长缓存。
    # v2.3 P0：location 内显式全量 types——系统 mime.types 常缺 .mjs（判为
    # application/octet-stream → 浏览器拒绝 ES 模块导入，公网 worker 故障根因）；
    # nginx 的 types 块会整体覆盖继承，故此处必须自足列举 Vite 产物扩展名
    location /assets/ {
        types {
            text/css                              css;
            text/javascript                       js mjs;
            application/json                      json;
            image/svg+xml                         svg;
            image/png                             png;
            image/jpeg                            jpg jpeg;
            image/gif                             gif;
            image/webp                            webp;
            image/avif                            avif;
            image/x-icon                          ico;
            font/woff2                            woff2;
            font/woff                             woff;
            application/font-sfnt                 ttf otf;
            application/wasm                      wasm;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 入口
    location = / {
        try_files /index.html =404;
    }

    # /api 反代：SSE 友好（缓冲关、超时 10min、HTTP/1.1 长连接）
    location /api/ {
        proxy_pass http://127.0.0.1:39321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;          # 覆盖式注入（匿名限流依据）
        proxy_set_header X-Forwarded-For $remote_addr;    # 不用 $proxy_add_x_forwarded_for（防伪造）
        proxy_set_header Connection "";

        # SSE：关闭缓冲（否则翻译进度流被卡死）+ 读超时对齐大文档
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 上传上限（与后端 GEMINUS_MAX_UPLOAD_MB=200 对齐，留边界余量）
        client_max_body_size 220m;
    }
